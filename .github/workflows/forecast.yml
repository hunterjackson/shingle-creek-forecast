name: Forecast

# Every 3 hours. 13:30 UTC is the first run each day with the 12Z gauge reading,
# the MRMS 24 h radar total ending 12Z and the 00Z GEFS run, i.e. a new issue day;
# the other runs refresh the current reading and pick up late-arriving data.
on:
  schedule:
    - cron: "30 1-22/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shingle-pipeline
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Restore input cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: data
          key: inputs-${{ github.run_id }}
          restore-keys: inputs-

      - name: Download model (and input history if the cache is empty)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download model --pattern shingle.pkl --dir models --clobber
          if [ -z "${{ steps.cache.outputs.cache-matched-key }}" ]; then
            gh release download inputs --pattern inputs.tar.gz --clobber
            tar -xzf inputs.tar.gz && rm inputs.tar.gz
          fi

      - run: uv sync --locked

      # Data servers (gridMET's THREDDS, USGS, GEFS on S3) occasionally refuse connections for
      # minutes at a time; the in-code retries only span ~50 s. Wait and try again rather than
      # skip the run: fetches are incremental, so each retry is a handful of small requests.
      # Nothing is logged or written to the site until the fetch succeeds.
      - name: Forecast
        run: |
          for wait in 0 600 1200; do
            if [ "$wait" -gt 0 ]; then echo "::warning::predict failed; retrying in $((wait / 60)) min"; sleep "$wait"; fi
            uv run shingle predict --log site/data/forecast_log.csv && exit 0
          done
          exit 1

      - name: Build site data
        run: uv run shingle site --log site/data/forecast_log.csv --out-dir site/data

      - name: Save input cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: inputs-${{ github.run_id }}

      - name: Commit forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update forecast data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push -q

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploy runs as its own job: deploy-pages looks the artifact up through the API,
  # and querying in the same job less than a second after the upload sometimes found
  # nothing ("No artifacts named github-pages"). Starting a new job gives it time to
  # show up.
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
