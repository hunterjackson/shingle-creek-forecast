name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
