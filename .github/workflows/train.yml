name: Train

# Monthly refit on everything up to 8 days ago; replaces the model and the input
# history bundle attached to the `model` and `inputs` releases.
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shingle-pipeline
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Restore input cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: data
          key: inputs-${{ github.run_id }}
          restore-keys: inputs-

      - name: Download input history if the cache is empty
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          gh release download inputs --pattern inputs.tar.gz --clobber
          tar -xzf inputs.tar.gz && rm inputs.tar.gz

      - run: uv sync --locked

      - name: Update inputs
        run: uv run shingle update

      - name: Train
        run: uv run shingle train

      - name: Check the new model forecasts
        run: uv run shingle predict --no-update --out /tmp/check.json --log /tmp/check.csv && cat /tmp/check.json

      - name: Publish model and input history
        run: |
          tar -czf inputs.tar.gz --exclude=data/mrms --exclude='data/nwm_retro.parquet' --exclude='data/gr4j_sim_*' data
          gh release upload model models/shingle.pkl --clobber
          gh release upload inputs inputs.tar.gz --clobber

      - name: Save input cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: inputs-${{ github.run_id }}
