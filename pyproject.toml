[project]
name = "shingle-creek-forecast"
version = "0.1.0"
description = "7-day stage forecast for Shingle Creek at Campbell, FL (USGS 02264495 / NWS SHIF1)"
readme = "README.md"
authors = [
    { name = "Hunter Jackson", email = "hunter.jackson92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cfgrib>=0.9.15.1",
    "eccodes>=2.50.1",
    "eccodeslib>=2.50.0.34",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "s3fs>=2026.9.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
shingle = "shingle.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shingle"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network APIs (deselected by default)"]
addopts = "-m 'not live'"
